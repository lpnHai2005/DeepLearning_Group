# Tự sinh BTL02/tracking/activity_log.csv từ lịch sử git sau mỗi push, để Google Sheets kéo về bằng IMPORTDATA.
name: activity-log
on:
  push:
    branches: [main]
    paths: ["BTL02/**"]
permissions:
  contents: write
concurrency:
  group: activity-log
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git_activity.py cần toàn bộ lịch sử
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python BTL02/tracking/git_activity.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BTL02/tracking/activity_log.csv
          if git diff --cached --quiet; then echo "không đổi"; exit 0; fi
          git commit -m "chore: cập nhật activity_log.csv [skip ci]"
          git pull --rebase origin main
          git push origin main
